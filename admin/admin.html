<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1222"><title>GlobalFind · Admin</title><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body><header><a class="brand" href="/">GLOBAL<span>FINDS</span><small>ADMIN</small></a><button id="logout" hidden>LOG OUT</button></header><main><section class="login-card" id="login-card"><p class="eyebrow">STORE MANAGEMENT</p><h1>Admin sign in</h1><p class="muted">Sign in to manage the GlobalFind catalog.</p><form id="login-form"><label for="password">ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">SIGN IN ↗</button><p class="message" id="login-message"></p></form></section><section id="dashboard" hidden><div class="page-title"><div><p class="eyebrow">CATALOG</p><h1>Products <span id="product-count">0</span></h1></div><button id="new-product" class="primary">＋ ADD PRODUCT</button></div><div class="admin-layout"><form id="product-form" class="editor" hidden><h2 id="form-title">Add product</h2><input type="hidden" id="product-id"><label>PRODUCT NAME<input id="name" maxlength="180" required></label><div class="two-col"><label>CATEGORY<select id="category"><option value="top-quality">Top Quality</option><option value="shoes">Shoes</option><option value="hoodies-sweaters">Hoodies-Sweaters</option><option value="tracksuits">Tracksuits</option><option value="jeans-pants">Jeans-Pants</option><option value="jackets-puffers">Jackets-Puffers</option><option value="t-shirts-longsleeves">T-shirts-Longsleeves</option><option value="shorts">Shorts</option><option value="accessories">Accessories</option></select></label><label>PRICE (USD)<input id="price" type="number" min="0" step="0.01" required></label></div><label>BADGE <input id="badge" placeholder="e.g. TOP PICK"></label><label>PRODUCT IMAGE<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>JPG, PNG, WEBP or GIF · up to 5 MB</small></label><div class="preview" id="image-preview"><span>Image preview</span></div><label>IMAGE URL <input id="image-url" placeholder="Uploaded image URL appears here"></label><label>PRODUCT LINK <input id="supplier-url" type="url" placeholder="https://..."></label><label class="checkbox"><input id="active" type="checkbox" checked> Visible on public site</label><p class="message" id="form-message"></p><div class="form-actions"><button type="button" id="cancel-edit" class="secondary">CANCEL</button><button class="primary">SAVE PRODUCT</button></div></form><div class="product-list" id="product-list"></div></div></section></main><div class="toast" id="toast"></div></body></html>
