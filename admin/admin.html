<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1222"><title>GlobalFind · Admin</title><link rel="stylesheet" href="admin.css?v=5"><script src="admin.js?v=5" defer></script></head><body><header><a class="brand" id="brand-home" href="./">GLOBAL<span>FINDS</span><small>ADMIN</small></a><button id="logout" hidden>LOG OUT</button></header><main><section class="login-card" id="login-card"><p class="eyebrow">STORE MANAGEMENT</p><h1>Admin sign in</h1><p class="muted">Sign in to manage the GlobalFind catalog.</p><form id="login-form"><label for="password">ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">SIGN IN ↗</button><p class="message" id="login-message"></p></form></section><section id="dashboard" hidden><div class="page-title"><div><p class="eyebrow">CATALOG</p><h1>Products <span id="product-count">0</span></h1></div><button id="new-product" class="primary">＋ ADD PRODUCT</button></div><div class="site-settings-card"><div class="site-settings-heading"><p class="eyebrow">HOMEPAGE SETTINGS</p><h2>Banner & social links</h2></div><form id="site-settings-form"><div class="two-col"><label>WHATSAPP LINK<input id="whatsapp-url" type="url" placeholder="https://wa.me/..."></label><label>TELEGRAM LINK<input id="telegram-url" type="url" placeholder="https://t.me/..."></label></div><label>BANNER IMAGE<input id="banner-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>Upload JPG, PNG, WEBP or GIF · up to 5 MB</small></label><div class="preview banner-preview" id="banner-preview"><span>No banner image selected</span></div><label>OR IMAGE URL<input id="banner-url" type="text" placeholder="https://.../banner.jpg"></label><p class="message" id="settings-message"></p><div class="form-actions"><button class="primary">SAVE SITE SETTINGS</button></div></form></div><div class="admin-layout"><form id="product-form" class="editor" hidden><h2 id="form-title">Add product</h2><input type="hidden" id="product-id"><label>PRODUCT NAME<input id="name" maxlength="180" required></label><div class="two-col"><label>CATEGORY<select id="category"><option value="top-quality">Top Quality</option><option value="shoes">Shoes</option><option value="hoodies-sweaters">Hoodies-Sweaters</option><option value="tracksuits">Tracksuits</option><option value="jeans-pants">Jeans-Pants</option><option value="jackets-puffers">Jackets-Puffers</option><option value="t-shirts-longsleeves">T-shirts-Longsleeves</option><option value="shorts">Shorts</option><option value="accessories">Accessories</option></select></label><label>PRICE (USD)<input id="price" type="number" min="0" step="0.01" required></label></div><label>BADGE <input id="badge" placeholder="e.g. TOP PICK"></label><label>PRODUCT IMAGE<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>JPG, PNG, WEBP or GIF · up to 5 MB</small></label><div class="preview" id="image-preview"><span>Image preview</span></div><label>IMAGE URL <input id="image-url" placeholder="Uploaded image URL appears here"></label><details class="agent-links-editor" open><summary>PRODUCT LINKS · 15 AGENTS <span>Add a shopping link for each agent</span></summary><div class="agent-link-fields"><label>KAKOBUY<input type="url" data-agent-link="kakobuy" placeholder="https://..."></label><label>LITBUY<input type="url" data-agent-link="litbuy" placeholder="https://..."></label><label>USFANS<input type="url" data-agent-link="usfans" placeholder="https://..."></label><label>LOVEGOBUY<input type="url" data-agent-link="lovegobuy" placeholder="https://..."></label><label>HIPO BUY<input type="url" data-agent-link="hipobuy" placeholder="https://..."></label><label>OOPBUY<input type="url" data-agent-link="oopbuy" placeholder="https://..."></label><label>ACBUY<input type="url" data-agent-link="acbuy" placeholder="https://..."></label><label>SUGARGOO<input type="url" data-agent-link="sugargoo" placeholder="https://..."></label><label>HOO BUY<input type="url" data-agent-link="hoobuy" placeholder="https://..."></label><label>FISHGOO<input type="url" data-agent-link="fishgoo" placeholder="https://..."></label><label>JOYA GOO<input type="url" data-agent-link="joyagoo" placeholder="https://..."></label><label>BBDBUY<input type="url" data-agent-link="bbdbuy" placeholder="https://..."></label><label>CNFANS<input type="url" data-agent-link="cnfans" placeholder="https://..."></label><label>MULEBUY<input type="url" data-agent-link="mulebuy" placeholder="https://..."></label><label>ALLCHINABUY<input type="url" data-agent-link="allchinabuy" placeholder="https://..."></label></div></details><label class="checkbox"><input id="active" type="checkbox" checked> Visible on public site</label><p class="message" id="form-message"></p><div class="form-actions"><button type="button" id="cancel-edit" class="secondary">CANCEL</button><button class="primary">SAVE PRODUCT</button></div></form><div class="product-list" id="product-list"></div></div></section></main><div class="toast" id="toast"></div></body></html>
